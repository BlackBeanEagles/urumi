apiVersion: v1
kind: Secret
metadata:
  name: urumi-secrets
type: Opaque
stringData:
  mariadb-password: {{ required "secrets.mariadbPassword is required" .Values.secrets.mariadbPassword | quote }}
  mariadb-root-password: {{ required "secrets.mariadbRootPassword is required" .Values.secrets.mariadbRootPassword | quote }}
  gateway-admin-password: {{ required "secrets.gatewayAdminPassword is required" .Values.secrets.gatewayAdminPassword | quote }}
  llm-api-key: {{ .Values.secrets.llmApiKey | quote }}
