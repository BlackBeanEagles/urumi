apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: urumi}
spec:
  {{- with .Values.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.host.dashboard }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: gateway, port: {number: 3000}}
    - host: {{ .Values.host.store }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: wordpress, port: {number: 80}}
